name: Setup SukiSU-Ultra (KPM)
description: Download and configure SukiSU-Ultra with KPM support and version tracking
inputs:
  ksu_commit:
    description: "KSU Commit"
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Download SukiSU-Ultra (susfs branch with built-in SUSFS+KPM)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/aosp
      run: |
        set -ex
        # Clone DeepLunaria SukiSU-Ultra susfs branch directly (setup.sh would clone wrong repo)
        GKI_ROOT="$PWD"
        if [ -d "$GKI_ROOT/common/drivers" ]; then
          DRIVER_DIR="$GKI_ROOT/common/drivers"
        else
          DRIVER_DIR="$GKI_ROOT/drivers"
        fi

        git clone https://github.com/DeepLunaria/SukiSU-Ultra.git -b susfs KernelSU
        cd KernelSU
        git rev-parse --short HEAD
        cd "$DRIVER_DIR"
        ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$GKI_ROOT/KernelSU/kernel")" kernelsu

        DRIVER_MAKEFILE="$DRIVER_DIR/Makefile"
        DRIVER_KCONFIG="$DRIVER_DIR/Kconfig"
        grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
        grep -q "source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"

        cd "$GKI_ROOT/KernelSU/kernel"
        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        BASE_VERSION=13000
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
        # Version fallback lives in Kbuild or Makefile depending on branch structure
        if [ -f Kbuild ]; then
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := susfs/" Kbuild
        else
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Makefile || true
          grep -q "KSU_VERSION_FALLBACK" Makefile || echo "KSU_VERSION_FALLBACK := ${KSU_VERSION}" >> Makefile
        fi
        echo "KSU version set to ${KSU_VERSION}"


    - name: Enable KernelSU + KPM + SUSFS Config
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        cat >> "${{ github.workspace }}/wild_gki.fragment" << 'EOF'
        # KernelSU Configuration (SukiSU-Ultra susfs branch)
        CONFIG_KSU=y
        # KPM (Kernel Patch Module) support - required for cheetah KPM modules
        CONFIG_KPM=y
        # KPM requires KALLSYMS_ALL
        CONFIG_KALLSYMS_ALL=y
        # SUSFS (built into DeepLunaria susfs branch)
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        EOF

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/aosp/KernelSU
      run: |
        # Extract and export KSU version info (never fail on missing tags)
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "susfs")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        KSU_VERSION=$((13000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
