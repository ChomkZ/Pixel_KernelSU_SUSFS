name: Setup TCP BBR v3
description: configure TCP BBR v3
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., 12)'
    required: true

runs:
  using: composite
  steps:
    - name: Extract BBG Version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/aosp
      run: |
        # Try new patch naming first, fall back to legacy
        if [ -f "$GITHUB_WORKSPACE/kernel_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" ]; then
          cp "$GITHUB_WORKSPACE/kernel_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" ./
          patch -p1 --forward < "0001-net-tcp-backport-BBRv3-to-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" || echo "BBR patch applied with rejects - continuing"
        elif [ -f "$GITHUB_WORKSPACE/kernel_patches/bbrv3-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" ]; then
          cp "$GITHUB_WORKSPACE/kernel_patches/bbrv3-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" ./
          patch -p1 --forward < "bbrv3-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" || echo "BBR patch applied with rejects - continuing"
        else
          echo "No BBR patch found for ${{ inputs.android_version }}-${{ inputs.kernel_version }} - skipping BBR source patch (config-only)"
        fi

    - name: Fix modules.bzl
      shell: bash
      if: false
      working-directory: ${{ github.workspace }}/kernel/aosp
      run: |
        if [ "$inputs.kernel_version" == "6.1" ]; then
          mods_file=modules.bzl
          for m in "net/ipv4/tcp_bic.ko" "net/ipv4/tcp_htcp.ko" "net/ipv4/tcp_westwood.ko"; do
            grep -q "'$m'" "$mods_file" && continue
            sed -i "/_ARM64_GKI_MODULES_LIST = \[/,/^]/ s/^]/    \"$m\",\n]/" "$mods_file"
          done
        fi

    - name: Add BBRv3 Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/wild_gki.fragment" << 'EOF'
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_DEFAULT_BBR=y
        CONFIG_DEFAULT_TCP_CONG="bbr"
        CONFIG_NET_SCH_FQ=y
        # CONFIG_TCP_CONG_BIC is not set
        # CONFIG_TCP_CONG_WESTWOOD is not set
        # CONFIG_TCP_CONG_HTCP is not set
        EOF
        

    
